openapi: 3.0.3
info:
  title: PetriDishOfMadness Control API
  version: 1.12.0
  description: >
    REST control + config surface for the chaos lab. The live data stream is WS /ws
    (see events.schema.json). All endpoints are unauthenticated (local-first, single-user).
    v1.1.0 (W6) adds read-only endpoints over the append-only event log (event-log.md §7)
    that power the /inspector annex: events, turn traces, rule history, relationships,
    snapshots, replay, and analytics (9-AWI + model-vs-model). These serve deep/full-history
    replay in live mode; the /inspector panels also compute from the client-side rolling
    history so they render in mock mode with no backend.
    v1.3.0 (W11a, EM-086) adds GET /api/runs and an OPTIONAL `run_id` query param on every
    read endpoint (events, turns, rules/history, relationships, snapshots, replay,
    analytics). Omitted run_id = the active run (unchanged behavior). Unknown run_id = 404.
    "Active" is determined by MAX(id), NEVER by the `status` column — crashes/hot-reloads
    leave dead runs `running` forever (EM-086 note 1). For PAST runs, place/world geometry
    comes from that run's earliest snapshot `state_json`, not the `places` table (which the
    live run re-owns via INSERT OR REPLACE — EM-086 note 2).
    v1.5.0 (re-entry Phase 4, EM-112+EM-119) adds the Model-Family Arena: GET /api/arena
    (cross-run civilization-outcome standings grouped by `runs.model_family`) and the
    SEQUENTIAL parallel-worlds tournament (/api/arena/tournament POST start / GET status /
    DELETE abort) which casts every agent from one coarse model family per run through the
    live TickLoop — never concurrent (free-tier key-pool protection, ARCHITECTURE.md
    §Instance). RunRow gains a nullable `model_family` stamp (null = un-stamped); a fork
    inherits its parent's stamp.
    v1.12.0 (EM-352+EM-353) closes the loop on lane badness. EM-352: each top-level
    `routes` entry gains the chronic evidence (`worst_rate`, `runs_high`, `chronic`) and the
    response gains the `chronic_rule` it was judged by ({rate_threshold, min_runs}); a lane
    whose OWN rate reaches the threshold in `min_runs` or more runs is flagged `chronic` and
    sorts FIRST, so a persistently bad lane flags itself and a single bad draw never does
    (the flag counts RUNS — `runs` travels with it as the sample size). EM-353: the per-lane
    failure curves are OPT-IN via `GET /api/arena?lane_curves=1` — they were about half the
    payload, so the default read carries the rates only and echoes `lane_curves: false`
    (measured on the live DB: 44.6 KB default vs 79.4 KB with curves).
    v1.11.0 (EM-350+EM-351) makes a lane's badness measurable in TIME and across runs.
    EM-350: each `by_route` entry gains `curve` — that lane's failures AND attempts per tick
    bucket on the same ≤48-bucket plan as the run's `curve` ([{tick, failures, attempts}]), so
    a lane that degraded only MID-run is distinguishable from one that was bad the whole way
    (a single pooled rate cannot tell them apart). Only the busiest lanes are charted; the
    rest carry `curve: []`. EM-351: the Arena summary gains a top-level `routes` array —
    `[{lane, failures, attempts, runs, failure_rate}]` pooling every lane's failures and
    attempts across the Arena's runs (worst pooled rate first), so a lane that looks bad in
    ONE draw is judged against its whole record (`runs` is the sample size).
    v1.7.0 (EM-343) adds the failure-taxonomy read side to GET /api/arena: every run card
    (family standings AND contact runs) gains an additive `failures` block reporting the
    TRUE action_rejected / provider_error / parse_failure counts + shares and the
    failures-per-`llm_call` rate, read off the append-only event log. Pre-EM-340 runs are
    reported honestly: their overloaded `parse_failure` rows are re-derived from their
    payloads by the same classifier the emit path uses (event-log.md v1.6.0).
    v1.10.0 (EM-349) adds the per-LANE failure rate to the run's `failures` block: `by_route`
    (`{lane: {failures, attempts, failure_rate}}`, worst rate first) measured against each
    lane's own `llm_call` attempts, plus `failures_attributed` / `attempts_attributed`
    coverage — so a lane that carries the most traffic is not mistaken for a bad one.
    v1.9.0 (EM-348) adds LANE attribution to each `by_agent` entry: `routes` (the lane id each
    failure row was `routed_via` → count, descending), `top_route` and `routes_attributed`
    (coverage; unnamed rows stay unattributed). So the per-agent cut NAMES the broken route
    instead of leaving an opaque actor id.
    v1.8.0 (EM-344–347) moves that classifier into a leaf module (`petridish/taxonomy.py`)
    shared by the emit path and the read side (the API no longer depends on the agent
    runtime), and EXTENDS the `failures` block with `curve` (EM-345 — failures over ticks
    as ≤48 even-width bucket sums per kind, so a one-tick outage reads as a spike) and
    `by_agent` (EM-346 — the same taxonomy per `actor_id`, including agents with turns but
    no failures). Each family block also gains a pooled `failures` rollup (EM-347).
servers:
  - url: http://localhost:8000
paths:
  /api/health:
    get:
      summary: Liveness
      responses: { "200": { description: ok, content: { application/json: { schema: { type: object, properties: { status: { type: string }, tick: { type: integer }, running: { type: boolean } } } } } } }
  /api/state:
    get:
      summary: Full world snapshot (same shape as WS world_state)
      responses: { "200": { description: snapshot, content: { application/json: { schema: { type: object } } } } }
  /api/config:
    get:
      summary: Effective world config
      responses: { "200": { description: config, content: { application/json: { schema: { type: object } } } } }
  /api/profiles:
    get:
      summary: Model profiles (the legend) with availability
      responses: { "200": { description: profiles, content: { application/json: { schema: { type: array, items: { type: object, properties: { name: {type: string}, adapter: {type: string}, model_id: {type: string}, color: {type: string}, available: {type: boolean} } } } } } } }
  /api/control/start:
    post: { summary: Start/resume the loop, responses: { "200": { description: ok } } }
  /api/control/pause:
    post: { summary: Pause the loop, responses: { "200": { description: ok } } }
  /api/control/step:
    post: { summary: Advance exactly one turn, responses: { "200": { description: ok } } }
  /api/control/speed:
    post:
      summary: Set tick interval (seconds between turns)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [tick_interval_seconds], properties: { tick_interval_seconds: { type: number, minimum: 0.1, maximum: 60 } } } } } }
      responses: { "200": { description: ok } }
  /api/control/reset:
    post:
      summary: Reset the world from config (optionally override seed)
      responses: { "200": { description: ok } }
  /api/agents/{id}/model:
    post:
      summary: Reassign an agent's model profile (takes effect next turn) — the marquee feature
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [profile], properties: { profile: { type: string } } } } } }
      responses: { "200": { description: ok }, "404": { description: unknown agent }, "400": { description: unknown profile } }
  /api/agents:
    post:
      summary: Spawn an agent (W7 EM-063 — god-mode immediate, or governance-gated when mode=governance)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, profile], properties: { name: {type: string}, personality: {type: string}, profile: {type: string}, location: {type: string}, mode: { type: string, enum: [god, governance], default: god, description: "god=immediate; governance=enqueue admit_agent proposal" } } } } } }
      responses: { "201": { description: "created (god) — emits agent_spawned{method:god}" }, "202": { description: "accepted (governance) — admit_agent proposal enqueued; agent admitted iff vote passes" } }
  /api/animals:
    get:
      summary: List animals with state (W8 EM-064) — also present in world_state.animals; empty array when no run/animals (never 500)
      responses: { "200": { description: animals, content: { application/json: { schema: { type: array, items: { type: object } } } } } }
    post:
      summary: Spawn an animal immediately (god-mode), emitting animal_spawned. Animals have no credits and are not in the agent round-robin.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [species, name], properties: { species: { type: string, enum: [cat, dog] }, name: { type: string }, location: { type: string, default: plaza }, personality: { type: string, default: "" } } } } } }
      responses: { "201": { description: "created — {status, animal_id}" }, "400": { description: unknown species }, "503": { description: not initialized } }
  /api/buildings:
    get:
      summary: List buildings/structures with state (W7 EM-061) — also available in world_state.buildings
      responses: { "200": { description: buildings, content: { application/json: { schema: { type: array, items: { type: object } } } } } }
  /api/agents/{id}:
    delete:
      summary: Kill/remove an agent
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: ok } }
  /api/events/inject:
    post:
      summary: Inject a random world event (chaos knob)
      requestBody: { content: { application/json: { schema: { type: object, properties: { kind: { type: string, enum: [windfall, famine, blackout, festival], description: "optional; random if omitted" } } } } } }
      responses: { "200": { description: ok } }
  # --- W6 read-only event-log endpoints (event-log.md §7). Default-scoped to the active
  # run; v1.3.0 (W11a, EM-086): every endpoint below also accepts optional `run_id`. ---
  /api/runs/fork:
    post:
      summary: Fork a past run at tick T into a NEW run (W11b EM-101)
      description: >
        Restores `World.from_snapshot(replay(T))` of the source run, applies optional
        `place_overrides` (replace the town geometry — the multi-city experiment), starts
        a new run with `forked_from`/`forked_at_tick` lineage, and pauses it (the user
        presses play). 404 unknown run; 400 tick out of range / invalid overrides.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id, tick]
              properties:
                run_id: { type: integer }
                tick: { type: integer }
                place_overrides:
                  type: array
                  description: optional full replacement places list (same shape as config world.places)
                  items: { type: object }
      responses:
        "201": { description: "forked — {run_id} of the new run" }
        "400": { description: bad tick or overrides }
        "404": { description: unknown run }
  /api/billboard:
    post:
      summary: Post a god/watcher reply on the village billboard (W11b EM-091)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 280 }
                in_reply_to: { type: string, description: "optional reference to a prior post" }
      responses:
        "201": { description: "posted — emits billboard_posted with actor_type god" }
        "422": { description: empty/whitespace/over-280 }
        "503": { description: world not initialized }
  /api/personas:
    get:
      summary: Persona library — config-defined character cards (W11b EM-092)
      responses:
        "200":
          description: personas from config/personas.yaml
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    archetype: { type: string }
                    personality: { type: string }
                    suggested_profile: { type: string }
  /api/runs:
    get:
      summary: List all persisted runs, newest first (W11a EM-086 — the run browser)
      description: >
        `is_active` is true ONLY for MAX(id) while the loop holds it; `status` is reported
        as stored but is unreliable for liveness (see info.description). `max_tick` and
        `event_count` come from the events table; `config_summary` is a small projection of
        runs.config_json (agent names/profiles, seed) — never the full config blob.
      responses:
        "200":
          description: runs, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RunRow' }
  /api/arena:
    get:
      summary: Model-Family Arena standings (EM-119)
      description: >
        Every run stamped with `runs.model_family` grouped by family: per-run outcome cards
        (population / laws_passed / buildings / crimes / credits) + downsampled population
        sparklines, plus family-level per-run means. Zero-LLM, read-only.
        EM-334 (v1.6.0): the response gains the additive `contact_runs` array — every run
        whose config_json carries an ARMED `world.contact` block, each card carrying the
        family pairing, the ordinary outcome card, per-settlement populations from the
        run's latest snapshot, the contact marker latch, the honesty ledger, and the
        crossing/travel event counts. No new persistence (the run self-describes).
        EM-343 (v1.7.0): every run card (family standings AND contact runs) gains the
        additive `failures` block — the true failure taxonomy read off the event log:
        `{counts, shares, total, turns, failure_rate, legacy_rows_reclassified}`
        (`legacy_rows_reclassified` = pre-EM-340 overloaded rows re-derived from payload).
        EM-345/346 (v1.8.0): the block also carries `curve` (failures over ticks as ≤48
        even-width bucket sums per kind — `[{tick, action_rejected, provider_error,
        parse_failure}]`) and `by_agent` (the same counts/shares/total/turns/failure_rate/
        legacy_rows_reclassified shape keyed by `actor_id`). EM-348 (v1.9.0): each
        `by_agent` entry also carries `routes` (lane → failure count, descending),
        `top_route` and `routes_attributed`. EM-349 (v1.10.0): the block also carries
        `by_route` (`{lane: {failures, attempts, failure_rate}}`, worst rate first) and the
        `failures_attributed` / `attempts_attributed` coverage counts. EM-350 (v1.11.0): each
        `by_route` entry also carries `curve` (`[{tick, failures, attempts}]` on the run
        curve's bucket plan — the lane's rate over time; `[]` for lanes past the busiest-N
        charting cap). EM-347 (v1.8.0): each
        family block gains a pooled `failures` rollup (`counts, shares, total, turns,
        failure_rate, legacy_rows_reclassified, runs`) — no `curve`/`by_agent`/`by_route`.
        EM-351 (v1.11.0): the response also gains the top-level `routes` array — the
        per-lane record pooled ACROSS the Arena's runs, which is the chronic-badness read:
        `[{lane, failures, attempts, runs, failure_rate}]`. EM-352 (v1.12.0): each entry also
        carries `worst_rate` (its highest per-run rate), `runs_high` (how many runs were at or
        above the threshold) and `chronic` (`runs_high >= chronic_rule.min_runs`); the
        response gains `chronic_rule: {rate_threshold, min_runs}` and orders chronic lanes
        FIRST so a persistently bad lane surfaces on its own. EM-353 (v1.12.0): the per-lane
        curves (`by_route[].curve`) are OPT-IN via the `lane_curves` query parameter (they
        are about half the payload) — the default read returns `curve: []` everywhere and
        `lane_curves: false`. All additive: a pre-EM-350/351/352 backend simply omits the
        new keys, and a pre-EM-353 caller keeps the curves by passing `lane_curves=true`.
      parameters:
        - name: lane_curves
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: >
            EM-353 — include the heavy per-lane failure curves (`by_route[].curve`). Off by
            default (they are ~half the payload); echoed back as the top-level
            `lane_curves` boolean. The run-level `failures.curve` always rides.
      responses:
        "200": { description: arena summary, content: { application/json: { schema: { type: object } } } }
  /api/contact:
    get:
      summary: First Contact read surface (EM-334)
      description: >
        The live two-town world's settlement cards (name / founded_tick / member_count /
        cast-family counts), the one-shot contact marker latch (the first cross-town
        departure in a contact world), the EM-333 honesty ledger (crossings + per-family
        {hops, mutated} fidelity), and the recent crossing/travel events. Zero-LLM,
        read-only, off the replay surface.
      responses:
        "200":
          description: contact summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean, description: "false when the live world carries no ARMED contact block — the panel renders its labeled zero state" }
                  tick: { type: integer }
                  settlements:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        founded_tick: { type: integer }
                        member_count: { type: integer }
                        families: { type: object, additionalProperties: { type: integer }, description: "cast family → living member count (EM-112 classifier)" }
                  contact_made:
                    nullable: true
                    type: object
                    properties:
                      tick: { type: integer }
                      agent_id: { type: string }
                      from_settlement: { type: string }
                      to_settlement: { type: string }
                  ledger:
                    nullable: true
                    type: object
                    properties:
                      crossings: { type: integer }
                      by_family: { type: object, additionalProperties: { type: object, properties: { hops: { type: integer }, mutated: { type: integer } } } }
                  crossings: { type: array, items: { type: object } }
                  travels: { type: array, items: { type: object } }
  /api/arena/tournament:
    post:
      summary: Start a SEQUENTIAL parallel-worlds tournament (EM-112)
      description: >
        For each family in order: reset the live world with EVERY agent cast from that
        family's lanes (available first, round-robin) and step it for `ticks_per_family`
        turns through the live TickLoop. Never concurrent (free-tier key-pool protection).
        The live timer stays paused; fork/reset are 409-guarded for the duration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [families]
              properties:
                families: { type: array, items: { type: string }, minItems: 1, maxItems: 8, description: "coarse family names (gemini, llama, qwen, …); 'other' (auto/mock) is un-castable" }
                ticks_per_family: { type: integer, minimum: 1, maximum: 500, default: 40 }
      responses:
        "202": { description: started — families, ticks_per_family, and the per-agent cast
          "casts" (agent name → lane profile) }
        "400": { description: unknown/un-castable family or out-of-range ticks }
        "409": { description: a tournament is already running }
    get:
      summary: Tournament status
      responses:
        "200": { description: "{status: idle|running|done|aborted|error, families,
          ticks_per_family, current_family, current_run_id, ticks_done_in_current, results[]}" }
    delete:
      summary: Abort the running tournament between turns
      description: The current family's run is left paused with its partial ticks.
      responses:
        "200": { description: aborting }
        "409": { description: no tournament is running }
  /api/events:
    get:
      summary: Query the append-only event log
      parameters:
        - { name: run_id, in: query, schema: { type: integer }, description: "scope to a past run (default: active run); 404 if unknown" }
        - { name: from_tick, in: query, schema: { type: integer } }
        - { name: to_tick, in: query, schema: { type: integer } }
        - { name: kinds, in: query, schema: { type: string }, description: "comma-separated kinds" }
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: turn_id, in: query, schema: { type: string } }
        - { name: after_seq, in: query, schema: { type: integer }, description: "keyset pagination (seq > after_seq)" }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
      responses: { "200": { description: events, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EventRow' } } } } } }
  /api/turns/{turn_id}:
    get:
      summary: The full ordered decision-trace chain for one turn (EM-056)
      parameters:
        - { name: turn_id, in: path, required: true, schema: { type: string } }
        - { name: run_id, in: query, schema: { type: integer } }
      responses: { "200": { description: chain, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EventRow' } } } } } }
  /api/rules/history:
    get:
      summary: Governance/laws history — proposal lifecycle + downstream consequences (EM-057)
      parameters: [ { name: run_id, in: query, schema: { type: integer } } ]
      responses: { "200": { description: rules, content: { application/json: { schema: { type: array, items: { type: object } } } } } }
  /api/relationships:
    get:
      summary: Relationship/conflict/gift events for the social graph, time-scrubbable (EM-058)
      parameters:
        - { name: run_id, in: query, schema: { type: integer } }
        - { name: agent_id, in: query, schema: { type: string } }
        - { name: from_tick, in: query, schema: { type: integer } }
        - { name: to_tick, in: query, schema: { type: integer } }
      responses: { "200": { description: timeline, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EventRow' } } } } } }
  /api/snapshots:
    get:
      summary: List snapshot ticks (ascending)
      parameters: [ { name: run_id, in: query, schema: { type: integer } } ]
      responses: { "200": { description: ticks, content: { application/json: { schema: { type: array, items: { type: object, properties: { tick: { type: integer } } } } } } } }
  /api/replay:
    get:
      summary: Replay materials for tick T — nearest prior snapshot + the fold-forward delta (EM-055)
      description: >
        v1.2.0 (W9, audit §B7): `events` contains ONLY the delta — rows with
        base.tick < event.tick <= T (strict on the left; the snapshot at base.tick
        already includes all tick-base.tick events, per event-log.md v1.1.0 §boundary).
        Clients fold `events` onto `base.state` without further filtering.
      parameters:
        - { name: tick, in: query, required: true, schema: { type: integer } }
        - { name: run_id, in: query, schema: { type: integer } }
      responses: { "200": { description: replay, content: { application/json: { schema: { type: object, properties: { base: { type: object, properties: { tick: { type: integer }, state: { type: object } } }, events: { type: array, items: { $ref: '#/components/schemas/EventRow' } } } } } } } }
  /api/analytics:
    get:
      summary: 9-AWI + model-vs-model analytics (event-log.md §7 get_analytics shape) (EM-059/067)
      parameters:
        - { name: run_id, in: query, schema: { type: integer } }
        - { name: from_tick, in: query, schema: { type: integer } }
        - { name: to_tick, in: query, schema: { type: integer } }
      responses: { "200": { description: analytics, content: { application/json: { schema: { type: object } } } } }
  /ws:
    get:
      summary: WebSocket event stream (see events.schema.json). Documented here for discoverability.
      responses: { "101": { description: switching protocols } }
components:
  schemas:
    RunRow:
      type: object
      description: One persisted run (W11a EM-086). See info.description for active/places caveats.
      properties:
        id: { type: integer }
        started_at: { type: string }
        ended_at: { type: string, nullable: true }
        status: { type: string, description: "as stored; unreliable for liveness — use is_active" }
        is_active: { type: boolean, description: "true iff this is MAX(id) and the loop holds it" }
        max_tick: { type: integer, description: "MAX(events.tick) for the run; 0 if no events" }
        event_count: { type: integer }
        forked_from: { type: integer, nullable: true, description: "parent run id (W11b EM-101)" }
        forked_at_tick: { type: integer, nullable: true }
        model_family: { type: string, nullable: true, description: "coarse family this run was cast from (EM-112; null = un-stamped; forks inherit)" }
        config_summary:
          type: object
          description: "small projection of config_json: {agents: [{name, profile}], seed?}"
    EventRow:
      type: object
      description: One append-only event-log row (event-log.md §2/§7). payload is kind-specific.
      properties:
        seq: { type: integer }
        run_id: { type: integer }
        tick: { type: integer }
        sim_time: { type: number, nullable: true }
        kind: { type: string }
        actor_id: { type: string, nullable: true }
        actor_type: { type: string }
        target_id: { type: string, nullable: true }
        profile: { type: string, nullable: true }
        turn_id: { type: string, nullable: true }
        text: { type: string, nullable: true }
        payload: { type: object }
        ts: { type: string }
