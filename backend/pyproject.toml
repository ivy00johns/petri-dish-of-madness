[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petri-dish-of-madness"
version = "0.1.0"
description = "PetriDishOfMadness backend – multi-agent chaos simulation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
    "websockets>=12.0",
    "tiktoken>=0.7,<1.0",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["petridish*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# EM-112 CI hardening — a hung test must fail with a stack dump in minutes,
# not wedge the runner for hours (the py3.11 wait_for cancel race did exactly
# that). 300s is ~100x the slowest test in the suite.
addopts = "--timeout=300"
